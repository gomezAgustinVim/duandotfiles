#################################
#             Shadows           #
#################################

shadow = true;

shadow-radius = 13;
shadow-opacity = 0.90;
shadow-offset-x = -17;
shadow-offset-y = -15;

shadow-color = "#292929";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'jgmenu'",
  "class_g = 'slop'",
  "class_g = 'Dunst'",
  "class_g = 'scratch'",
  "class_g = 'Spotify'",
  "class_g = 'retroarch'",
  "class_g = 'firefox'",
  "class_g = 'firefox-esr'",
  "class_g = 'dmenu'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

#################################
#           Fading              #
#################################

fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

no-fading-destroyed-argb = true;

fade-exclude = [
	"name = 'Eww - bar'",
    "class_g = 'slop'",
    "class_g = 'Polybar'",
    "class_g = 'scratch'"
];

#################################
#           Corners             #
#################################

corner-radius = 0

rounded-corners-exclude = [
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'popup'",
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'dmenu'",
  "class_g = 'mpv'",
];

#################################
#   Transparency / Opacity      #
#################################

inactive-opacity = 0.8;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'maim'",
    "class_g = 'KeePassXC'",
    "class_g = 'Dunst'",
    "class_g = 'firefox-esr'",
    "class_g = 'fcitx'",
    "class_g = 'Pcmanfm'"
];

opacity-rule = [
  "100:class_g = 'st'",
  "100:class_g = 'fcitx'"
];

#################################
#       General Settings        #
#################################

# Available backends "xrender" "glx" "egl" "xr_glx_hybrid"
backend = "xrender";

dithered-present = true;
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
glx-no-stencil = true;
use-damage = true;

log-level = "error";

rules: ({
  match = "class_g = 'fcitx' && focused";
  opacity = 1.0
})

#################################
#          Wintypes             #
#################################

wintypes:
{
  normal =  { fade = true; shadow = false; }
  tooltip = { focus = true; shadow = false; }
  dock =  { fade = true; }
  utility = { shadow = false; }
};
