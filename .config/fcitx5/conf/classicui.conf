# 候補ウィンドウを縦にする
Vertical Candidate List=True
# マウスホイールを使用して前または次のページに移動する
WheelForPaging=True
# フォント
Font="Fira Code 11"
# メニューフォント
MenuFont="Fira Code 10"
# トレイフォント
TrayFont="Fira Code SemiBold Demi-Bold 10"
# トレイラベルのアウトライン色
TrayOutlineColor=#1d1e32
# トレイラベルのテキスト色
TrayTextColor=#c7c7c7
# テキストアイコンを優先する
PreferTextIcon=False
# アイコンにレイアウト名を表示する
ShowLayoutNameInIcon=True
# 入力メソッドの言語を使用してテキストを表示する
UseInputMethodLanguageToDisplayText=True
# テーマ
Theme=default
# ダークテーマ
DarkTheme=default
# システムのライト/ダーク配色に従う
UseDarkTheme=True
# テーマとデスクトップでサポートされている場合は、システムのアクセントカラーに従う
UseAccentColor=True
# X11 で Per Screen DPI を使用する
PerScreenDPI=True
# フォント DPI を Wayland で強制する
ForceWaylandDPI=1
# Wayland で分数スケールを有効にする
EnableFractionalScale=True

