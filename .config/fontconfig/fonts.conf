<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <alias>
        <family>serif</family>
        <prefer><family>Libertinus Serif</family></prefer>
        <prefer><family>Jigmo</family></prefer>
        <prefer><family>Joy Pixels</family></prefer>
        <prefer><family>Noto Color Emoji</family></prefer>
        <prefer><family>FontAwesome</family></prefer>
        <prefer><family>Libertinus Math</family></prefer>
    </alias>
    <alias>
        <family>sans-serif</family>
        <prefer><family>Libertinus Sans</family></prefer>
        <prefer><family>Ubuntu</family></prefer>
        <prefer><family>Fira Sans</family></prefer>
        <prefer><family>Koruri</family></prefer>
        <prefer><family>Joy Pixels</family></prefer>
        <prefer><family>Noto Color Emoji</family></prefer>
        <prefer><family>FontAwesome</family></prefer>
    </alias>
    <alias>
        <family>sans</family>
        <prefer><family>Libertinus Sans</family></prefer>
        <prefer><family>Fira Sans</family></prefer>
        <prefer><family>Ubuntu</family></prefer>
        <prefer><family>Koruri</family></prefer>
        <prefer><family>Joy Pixels</family></prefer>
        <prefer><family>Noto Color Emoji</family></prefer>
        <prefer><family>FontAwesome</family></prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer><family>Libertinus Mono</family></prefer>
        <prefer><family>Fira Mono</family></prefer>
        <prefer><family>Joy Pixels</family></prefer>
        <prefer><family>Noto Color Emoji</family></prefer>
        <prefer><family>FontAwesome</family></prefer>
    </alias>
</fontconfig>
