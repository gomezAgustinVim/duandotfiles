[main]
# include=/usr/share/foot/themes/gruvbox-dark
font=Fira Code Nerd Font Propo:size=11
pad=8x8
term=foot
initial-window-size-chars=190x60

app-id=foot
title=pie nwn
locked-title=no

[scrollback]
lines=16384
indicator-format=percentage

[colors]
alpha=0.80

# -*- conf -*-
# Gruvbox

background=282828
foreground=ebdbb2
regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984
bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2

[key-bindings]
font-increase=Control+Shift+k
font-decrease=Control+Shift+j
font-reset=Control+0
search-start=Control+Shift+f
clipboard-copy=Alt+c
clipboard-paste=Alt+v
scrollback-up-half-page=Control+k
scrollback-down-half-page=Control+j
show-urls-launch=Control+Shift+l
