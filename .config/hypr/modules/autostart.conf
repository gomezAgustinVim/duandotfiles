#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-kde-authentication-agent-1 || /usr/libexec/polkit-kde-authentication-agent-1  || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Some fix idk
exec-once = nm-applet
exec-once = mpd
exec-once = fcitx5 -dr
exec-once = waybar
exec-once = hyprpaper
exec-once = waypaperd
exec-once = dunst
exec-once = brillo -I               # restore cached brightness
exec-once = hyprsunset
exec-once = hypridle
exec-once = udiskie
exec-once = xrdb -load ~/.config/x11/xresources
