#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --all
exec-once = pipewire
exec-once = wireplumber
exec-once = pipewire-pulse
exec-once = /usr/lib/hyprpolkitagent
exec-once = foot --server
exec-once = nm-applet
exec-once = blueman-applet
exec-once = mpd
exec-once = fcitx5 -dr
exec-once = waybar
exec-once = hyprpaper
exec-once = waypaperd               # cambiar wallpaper cada hora
exec-once = brillo -I               # restore cached brightness
exec-once = hyprsunset
exec-once = vespertined             # activar filtro de luz azul a las 18
exec-once = hypridle
exec-once = dunst
exec-once = udiskie
exec-once = xrdb -load ~/.config/x11/xresources     # used for nsxiv

