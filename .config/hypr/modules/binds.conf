$mainMod = SUPER # Sets "Windows" key as main modifier
$secMod = ALT # Alt is secondary modifier
$browser = firefox

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, C, forcekillactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod SHIFT, R, exec, hyprctl reload,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, F, fullscreen, # dwindle
bind = $mainMod SHIFT, J, togglesplit, # dwindle

# Mount android device
bind = $mainMod, M, exec, aft-mtp-mount ~/mnt
bind = $mainMod, U, exec, umount ~/mnt

 # Cycle windows if floating bring to top
bind = $secMod, tab, cyclenext
bind = $secMod, tab, bringactivetotop

# Toggle between last used workspace and current
bind = $mainMod, tab, workspace,previous

# Reiniciar Waybar
bind = $mainMod, W, exec, ~/.config/waybar/scripts/launch.sh

# Copy emoji
bind = $mainMod, G, exec, rofi -show emoji

# Change wallpaper at random
bind = $mainMod, B, exec, waypaper

# Abrir Aplicaciones
# Terminal, rofi y gestor de archivos
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu

# Aplicaciones principales
bind = $mainMod $secMod ,B, exec, $browser
bind = $mainMod $secMod ,G, exec, gimp
bind = $mainMod $secMod ,N, exec, nicotine
bind = $mainMod $secMod ,E, exec, electrum
bind = $mainMod $secMod ,T, exec, transmission-gtk
bind = $mainMod $secMod ,F, exec, filezilla
bind = $mainMod $secMod ,K, exec, keepassxc
bind = $mainMod $secMod ,V, exec, virt-manager
bind = $mainMod $secMod ,C, exec, code
bind = $mainMod $secMod ,S, exec, steam
bind = $mainMod $secMod ,O, exec, obs

# Aplicaciones CLI
bind = $mainMod $secMod ,M, exec, $terminal ncmpcpp
bind = $mainMod $secMod ,H, exec, $terminal htop

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows
bind = $mainMod CTRL, h, movewindow, l
bind = $mainMod CTRL, l, movewindow, r
bind = $mainMod CTRL, k, movewindow, u
bind = $mainMod CTRL, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
# esto esta igual que en bspwm o sea que ta bien
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
# esto esta igual que en bspwm o sea que ta bien
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace quietly
# esto esta igual que en bspwm o sea que ta bien
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brillo -q -A 5
bindel = ,XF86MonBrightnessDown, exec, brillo -q -U 5
bindel = ,XF86Calculator, exec, rofi -show calc -no-show-match -no-sort

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Manejar dunst

# close topmost notification
bind = CTRL SHIFT, space, exec, dunstctl close

# close all notifications currently being dis
bind = CTRL $secMod, space, exec, dunstctl close-all

bind = CTRL, period, exec, dunstctl history-pop

# Utility
# Ask for zathura theme
bind = $mainMod SHIFT, T, exec, chosen_zathura_theme.sh

# Screenshot keybindings NOTE: You may need to press Fn key as well
bind = ,Print, exec, screenshot.sh

# Call hyprlock
bind = $mainMod $secMod, L, exec, hyprlock
