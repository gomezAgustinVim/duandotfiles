# --------------------#
#      Keybinds       #
# --------------------#

set -g prefix C-SPACE

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-m if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# pane resize
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# select a pane
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key m select-pane -R

# sessionizer
bind f run "tmux neww ~/.local/bin/tmux-sessionizer.sh"
bind s run "tmux neww ~/.local/bin/session-finder.sh"
# bind S run "~/.config/scripts/tmux-sessionizer.sh ~/documents/projects/stormy"

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Recargado malongo nwn!"

# --------------------#
#      Options        #
# --------------------#

set-option -g default-terminal tmux-256color
set -as terminal-features "tmux-256color:RGB"

# enable Yazi's image preview to work correctly in tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Window title begins by 1 and not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi

set -g mouse on
set-option -g status-position bottom
set-option -g status "on"
set -g 'status-format[1]' ''
set -g status-interval 2

# im just listening to what neovim checkhealth has to say
# - ⚠️ WARNING `focus-events` is not enabled. |'autoread'| may not work.
set-option -g focus-events on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Tmux gruvbox theme
set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
run-shell '~/.config/tmux/plugins/tmux-gruvbox'
